name: garmin-running-coach-mcp

services:
  garmin-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      MCP_TRANSPORT: streamable-http
    ports:
      - "${GARMIN_MCP_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped
