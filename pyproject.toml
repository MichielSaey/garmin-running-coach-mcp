[project]
name = "garmin-running-coach-mcp"
version = "0.1.0"
description = "Garmin Connect MCP server for personal running coaching"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "mcp>=1.9,<2",
    "garminconnect==0.3.6",
    "pydantic",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
